<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Union Technical | Property Onboarding</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="inner">
    <div class="brand-lockup">
      <div class="brand-fallback"><span class="mark"></span><span>UT</span></div>
    </div>
    <div class="tag">Energy as a Service<br><strong>Admin</strong></div>
  </div>
</header>

<div class="hero"><div class="inner"><h1>Property onboarding</h1></div></div>

<div class="wrap" style="margin-top:40px;">

  <div class="card" style="margin-bottom:24px;">
    <h2>Add a property</h2>
    <form id="addForm">
      <div class="field"><label for="address">Address</label><input type="text" id="address" required></div>
      <div class="field"><label for="tenantName">Tenant name</label><input type="text" id="tenantName" required></div>
      <div class="field"><label for="foxDeviceSn">Fox device serial number</label><input type="text" id="foxDeviceSn" required></div>
      <div class="field"><label for="tenantEmail">Tenant email (optional at this stage)</label><input type="email" id="tenantEmail"></div>
      <div class="field"><label for="arraySizeKwp">Array size, kWp</label><input type="number" id="arraySizeKwp" step="0.1"></div>
      <div class="field"><label for="batteryCapacityKwh">Battery capacity, kWh</label><input type="number" id="batteryCapacityKwh" step="0.1"></div>
      <button type="submit" class="btn">Add property</button>
    </form>
    <div id="addMessage" class="demand-readout" style="display:none;"></div>
  </div>

  <div class="card">
    <h2>Properties</h2>
    <div style="overflow-x:auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th><th>Address</th><th>Tenant</th><th>Device SN</th><th>Email</th>
            <th>Fox linked</th><th>Last reading</th><th>Last rollup</th><th></th>
          </tr>
        </thead>
        <tbody id="propertiesBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script src="admin.js"></script>
</body>
</html>
