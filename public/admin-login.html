<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Union Technical | Admin Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="inner">
    <div class="brand-lockup">
      <div class="brand-fallback"><span class="mark"></span><span>UT</span></div>
    </div>
    <div class="tag">Energy as a Service<br><strong>Admin</strong></div>
  </div>
</header>

<div class="hero"><div class="inner"><h1>Property &amp; team onboarding</h1></div></div>

<div class="wrap" style="margin-top:40px;">
  <div class="card login-card">
    <h2>Sign in</h2>
    <p class="hint">Enter your Union Technical staff email and we'll send you a login link.</p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" required placeholder="you@uniontechnical.co.uk">
      </div>
      <button type="submit" class="btn">Send login link</button>
    </form>
    <div id="loginMessage" class="demand-readout" style="display:none;"></div>
    <p class="hint" style="margin-top:16px;">No account yet? Ask an existing Super Admin to add you from the Team members section.</p>
  </div>
</div>

<script src="admin-login.js"></script>
</body>
</html>
